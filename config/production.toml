[server]
address = "0.0.0.0"
port = 8080

[database]
url = "postgres://postgres:password@postgres:5432/storage"

[auth]
audience = "auth67"
issuer = "auth67"
access_token_lifetime_minutes = 15
refresh_token_lifetime_days = 30
max_failed_login_attempts = 5
account_lock_hours = 24

[otp]
ttl_minutes = 5
max_attempts = 3
max_messages_per_day = 10
cleanup_interval_minutes = 60

[crypto]
secret = ""  # Set via APP__CRYPTO__SECRET env var

[comms]
username = ""  # Set via APP__COMMS__USERNAME env var
password = ""  # Set via APP__COMMS__PASSWORD env var
from = ""  # Set via APP__COMMS__FROM env var
otp_message_template = "Your verification code is {code}"
resend_api_key = ""  # Set via APP__COMMS__RESEND_API_KEY env var

[audit]
retention_days = 90
cleanup_interval_hours = 24

[admin]
admins = []  # Set via APP__ADMIN__ADMINS env var
